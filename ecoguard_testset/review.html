<body>
<header>
  <div class="top"><div><div class="eyebrow">Aussie EcoGuard · Test set</div><h1>Ground truth review</h1></div>
    <div class="actions"><span id="save-state" role="status">Loading…</span><button id="download" type="button">Download CSV</button><button id="save" class="primary" type="button" disabled>Save CSV</button></div>
  </div>
  <p class="hint" id="save-hint">Choose counts and condition tags, then save. Click a photo to inspect it at full size.</p>
  <div class="filters">
    <label>Animal group<select id="folder"><option value="">All groups</option></select></label>
    <label>Review status<select id="status"><option value="all">All statuses</option><option value="">Unverified</option><option value="review">Needs review</option><option value="ok">Human verified</option><option value="reject">Rejected</option><option value="ai">AI reviewed</option><option value="spot">Spot check</option></select></label>
    <label>Find an image<input id="search" type="search" placeholder="Search filename…"></label>
    <span class="hint" id="visible-count"></span>
  </div>
  <p id="message" role="status" aria-live="polite"></p>
</header>

"source": "iNaturalist", "licence": "cc-by-nc", "attribution": "(c) Colin Trainor, some rights reserved (CC BY-NC)", "observation_url": "https://www.inaturalist.org/observations/8499429", "photo_id": "11338505", "verified": "ok"}, {"filename": "neg_hare/neg_hare_007.jpeg", "species": "none", "true_count": "0", "condition": "other", "role": "negative", "common_name": "brown hare (rabbit lookalike)", "scientific_name": "Lepus europaeus", "source": "iNaturalist", "licence": "cc-by-nc", "attribution": "(c) Kat, some rights reserved (CC BY-NC)", "observation_url": "https://www.inaturalist.org/observations/56302278", "photo_id": "89714404", "verified": "ok"}, {"filename": "neg_hare/neg_hare_008.jpg", "species": "none", "true_count": "0", "condition": "clear", "role": "negative", "common_name": "brown hare (rabbit lookalike)", "scientific_name": "Lepus europaeus", "source": "iNaturalist", "licence": "cc-by-nc", "attribution": "(c) Brian Rosenberg, some rights reserved (CC BY-NC)", "observation_url": "https://www.inaturalist.org/observations/63196700", "photo_id": "101384308", "verified": "ok"}]}</script>
<script>
'use strict';
let dataset = JSON.parse(document.getElementById('dataset').textContent);
let rows = dataset.rows, fields = dataset.fields;
let originals = new Map(rows.map(row => [row.filename, {...row}]));
let online = false, saving = false;
const editable = ['true_count', 'condition', 'verified'];
const tags = ['clear', 'night', 'other'];
const statuses = {'':'Unverified',ok:'Human verified',review:'Needs review',reject:'Rejected',ai:'AI reviewed',spot:'Spot check'};
const $ = id => document.getElementById(id);
function make(tag, text, className) { const node = document.createElement(tag); if(text !== undefined) node.textContent = text; if(className) node.className = className; return node; }
function changed(row) { const original = originals.get(row.filename); return editable.some(key => row[key] !== original[key]); }
function updates() { return rows.filter(changed).map(row => ({filename:row.filename,before:Object.fromEntries(editable.map(key => [key, originals.get(row.filename)[key]])),changes:Object.fromEntries(editable.filter(key => row[key] !== originals.get(row.filename)[key]).map(key => [key,row[key]]))})); }
function message(text, error=false) { $('message').textContent = text; $('message').className = error ? 'error' : ''; }
function updateState() { const total = rows.filter(changed).length; $('save-state').textContent = saving ? 'Saving…' : total ? `${total} unsaved image${total===1?'':'s'}` : 'No unsaved changes'; $('save').disabled = saving || !total; $('download').disabled = saving; document.querySelectorAll('.card').forEach(card => {const row = rows[Number(card.dataset.index)];card.classList.toggle('changed',changed(row));card.classList.toggle('rejected',row.verified==='reject');const badge=card.querySelector('.badge');badge.textContent=statuses[row.verified]||row.verified;badge.className=`badge ${row.verified}`;}); }
function setLabel(row,key,value) { row[key]=value; message('');updateState(); }
function render() {
  const selectedFolder=$('folder').value, selectedStatus=$('status').value, search=$('search').value.trim().toLowerCase();
  const groups = new Map(); let total=0;
  rows.forEach((row,index) => { const folder=row.filename.split('/')[0]; if(selectedFolder && folder!==selectedFolder || selectedStatus!=='all' && row.verified!==selectedStatus || !row.filename.toLowerCase().includes(search))return; if(!groups.has(folder))groups.set(folder,[]);groups.get(folder).push({row,index});total++; });
  const root=$('groups');root.replaceChildren();$('visible-count').textContent=`${total} of ${rows.length} images`;
  if(!total)root.append(make('p','No images match these filters.','empty'));
  groups.forEach((items,folder) => {
    const heading=make('h2',folder.replaceAll('_',' ')); heading.append(make('small',`${items.length} images`));root.append(heading);
    const grid=make('div',undefined,'grid');root.append(grid);
    items.forEach(({row,index})=>{
      const card=make('article',undefined,'card');card.dataset.index=index;card.setAttribute('aria-label',row.filename);grid.append(card);
      const link=make('a',undefined,'photo');link.href='images/'+row.filename.split('/').map(encodeURIComponent).join('/');link.target='_blank';link.rel='noopener';link.setAttribute('aria-label',`Open ${row.filename} full size`);
      const image=make('img');image.src=link.href;image.alt=row.filename;image.loading='lazy';link.append(image,make('span','Open full size ↗'));card.append(link);
      const body=make('div',undefined,'body');card.append(body);const title=make('div',undefined,'title');title.append(make('strong',row.filename.split('/').pop()),make('span',undefined,'badge'));body.append(title,make('p',`${row.common_name || row.species} · Expected: ${row.species}`,'meta'));
      const controls=make('div',undefined,'fields');body.append(controls);
      const countLabel=make('label','Count','field'),count=make('input');count.type='number';count.min='0';count.step='1';count.value=row.true_count;count.readOnly=row.species==='none';count.setAttribute('aria-label',`Count for ${row.filename}`);count.addEventListener('input',()=>setLabel(row,'true_count',count.value));countLabel.append(count);controls.append(countLabel);
      const statusLabel=make('label','Review status','field'),status=make('select');status.setAttribute('aria-label',`Review status for ${row.filename}`);Object.entries(statuses).forEach(([value,label])=>{const option=make('option',label);option.value=value;status.append(option);});status.value=row.verified;status.addEventListener('change',()=>setLabel(row,'verified',status.value));statusLabel.append(status);controls.append(statusLabel);
      const group=make('fieldset');group.append(make('legend','Condition'));const tagList=make('div',undefined,'tags');group.append(tagList);body.append(group);
      tags.forEach(tag=>{const label=make('label',undefined,'tag'),radio=make('input');radio.type='radio';radio.name=`condition-${index}`;radio.value=tag;radio.checked=row.condition===tag;radio.setAttribute('aria-label',`${tag} for ${row.filename}`);label.append(radio,make('span',tag));tagList.append(label);
        radio.addEventListener('change',()=>{if(radio.checked)setLabel(row,'condition',tag);});
      });
      if(row.observation_url && /^https?:\/\//i.test(row.observation_url)){const source=make('a','View source observation ↗','source');source.href=row.observation_url;source.target='_blank';source.rel='noopener';body.append(source);}
    });
  });updateState();
}
function validate() {
  for(const row of rows.filter(changed)){
    const old=originals.get(row.filename);
    if(row.true_count!==old.true_count && (row.true_count!=='' && !/^\d+$/.test(row.true_count) || row.species==='none' && row.true_count!=='0'))throw Error(`${row.filename}: count must be a nonnegative whole number; negative images require 0.`);
    if(row.condition!==old.condition && !tags.includes(row.condition))throw Error(`${row.filename}: choose exactly one condition: clear, night or other.`);
  }
}
function csvText() { const quote=value=>{const text=String(value??'');return /[",\r\n]/.test(text)?'"'+text.replaceAll('"','""')+'"':text;};return [fields,...rows.map(row=>fields.map(field=>row[field]))].map(values=>values.map(quote).join(',')).join('\r\n')+'\r\n'; }
function downloadCSV() {validate();const url=URL.createObjectURL(new Blob([csvText()],{type:'text/csv;charset=utf-8'}));const link=make('a');link.href=url;link.download='ground_truth.csv';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);message('CSV copy downloaded. Replace the original file with this copy to apply your edits.');}
$('download').addEventListener('click',()=>{try{downloadCSV();}catch(error){message(error.message,true);}});
$('save').addEventListener('click',async()=>{
  if(!online){try{downloadCSV();}catch(error){message(error.message,true);}return;}
  try{validate();saving=true;updateState();document.querySelectorAll('#groups input,#groups select').forEach(control=>control.disabled=true);
    const response=await fetch('/api/ground-truth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({updates:updates()})});const result=await response.json();if(!response.ok)throw Error(result.error||'Save failed.');rows=result.rows;fields=result.fields;originals=new Map(rows.map(row=>[row.filename,{...row}]));message('Saved to ground_truth.csv.');
  }catch(error){message(`${error.message} Your unsaved edits are still on screen.`,true);}
  finally{saving=false;render();}
});
['folder','status','search'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
window.addEventListener('beforeunload',event=>{if(rows.some(changed)){event.preventDefault();event.returnValue='';}});
async function start(){
  if(location.protocol==='http:'||location.protocol==='https:'){
    try{const response=await fetch('/api/ground-truth',{cache:'no-store'});if(!response.ok)throw Error('Unavailable');const result=await response.json();rows=result.rows;fields=result.fields;originals=new Map(rows.map(row=>[row.filename,{...row}]));online=true;}
    catch{message('Direct saving is unavailable. You can download a CSV copy instead.',true);}
  }
  $('save').textContent=online?'Save CSV':'Download edited CSV';
  $('save-hint').textContent=online?'Edit counts and condition tags, then Save CSV to update ground_truth.csv. Review status changes only when you choose it.':'Edit counts and condition tags, then download your CSV. Replace ground_truth.csv with the downloaded file to apply changes.';
  [...new Set(rows.map(row=>row.filename.split('/')[0]))].forEach(folder=>{const option=make('option',folder.replaceAll('_',' '));option.value=folder;$('folder').append(option);});render();
}
start();
</script>
