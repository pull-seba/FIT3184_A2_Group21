name: Ruff

on:
  pull_request:
    paths: ["**.py", "ruff.toml", ".github/workflows/ruff.yml"]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --diff
