<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Aussie EcoGuard</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.20/dist/amazon-cognito-identity.min.js"></script>
</head>
<body>
  <main class="card">
    <h1>Aussie EcoGuard</h1>
    <p id="message" class="message" hidden></p>

    <section id="login" data-step>
      <h2>Sign in</h2>
      <form id="login-form">
        <label>Email <input name="email" type="email" required autocomplete="username"></label>
        <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Sign in</button>
      </form>
      <p><a href="forgot.html">Forgot password?</a></p>
      <p>New here? <a href="signup.html">Create an account</a></p>
    </section>

    <section id="new-password" data-step hidden>
      <h2>Choose a new password</h2>
      <p>You signed in with a temporary password. Please set your own password to continue.</p>
      <form id="new-password-form">
        <label data-attr="given_name" hidden>First name <input name="given_name" autocomplete="given-name"></label>
        <label data-attr="family_name" hidden>Last name <input name="family_name" autocomplete="family-name"></label>
        <label>New password <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
        <small>At least 8 characters with upper case, lower case and a number.</small>
        <label>Confirm new password <input name="confirm" type="password" required autocomplete="new-password"></label>
        <button type="submit">Set password</button>
      </form>
    </section>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
