<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up - Aussie EcoGuard</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.20/dist/amazon-cognito-identity.min.js"></script>
</head>
<body>
  <main class="card">
    <h1>Aussie EcoGuard</h1>
    <p id="message" class="message" hidden></p>

    <section id="signup" data-step>
      <h2>Create an account</h2>
      <form id="signup-form">
        <label>First name <input name="firstName" required autocomplete="given-name"></label>
        <label>Last name <input name="lastName" required autocomplete="family-name"></label>
        <label>Email <input name="email" type="email" required autocomplete="email"></label>
        <label>Password <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
        <small>At least 8 characters with upper case, lower case and a number.</small>
        <label>Confirm password <input name="confirm" type="password" required autocomplete="new-password"></label>
        <button type="submit">Sign up</button>
      </form>
      <p>Already have an account? <a href="login.html">Sign in</a></p>
    </section>

    <section id="verify" data-step hidden>
      <h2>Verify your email</h2>
      <p>We emailed a verification code to <strong id="verify-email"></strong>.</p>
      <form id="verify-form">
        <label>Verification code <input name="code" required inputmode="numeric" autocomplete="one-time-code"></label>
        <button type="submit">Verify</button>
      </form>
      <p><button type="button" id="resend" class="link">Resend code</button></p>
    </section>
  </main>
  <script type="module" src="js/signup.js"></script>
</body>
</html>
