<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password - Aussie EcoGuard</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.20/dist/amazon-cognito-identity.min.js"></script>
</head>
<body>
  <main class="card">
    <h1>Aussie EcoGuard</h1>
    <p id="message" class="message" hidden></p>

    <section id="request" data-step>
      <h2>Reset your password</h2>
      <form id="request-form">
        <label>Email <input name="email" type="email" required autocomplete="email"></label>
        <button type="submit">Send reset code</button>
      </form>
      <p><a href="login.html">Back to sign in</a></p>
    </section>

    <section id="reset" data-step hidden>
      <h2>Enter reset code</h2>
      <form id="reset-form">
        <label>Code <input name="code" required inputmode="numeric" autocomplete="one-time-code"></label>
        <label>New password <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
        <small>At least 8 characters with upper case, lower case and a number.</small>
        <label>Confirm new password <input name="confirm" type="password" required autocomplete="new-password"></label>
        <button type="submit">Reset password</button>
      </form>
    </section>
  </main>
  <script type="module" src="js/forgot.js"></script>
</body>
</html>
