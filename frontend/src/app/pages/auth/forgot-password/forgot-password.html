<main class="card">
  <h1>Aussie EcoGuard</h1>
  @if (form.message(); as message) {
    <p class="message" [class]="message.type" role="status">{{ message.text }}</p>
  }

  @if (!email()) {
    <h2>Reset your password</h2>
    <form (submit)="form.submit($event, request)">
      <label>Email <input name="email" type="email" required autocomplete="email" /></label>
      <button type="submit" [disabled]="form.busy()">Send reset code</button>
    </form>
  } @else {
    <h2>Enter reset code</h2>
    <form (submit)="form.submit($event, reset)">
      <label>Code <input name="code" required inputmode="numeric" autocomplete="one-time-code" /></label>
      <label>New password <input name="password" type="password" required minlength="8" autocomplete="new-password" /></label>
      <small>At least 8 characters with upper case, lower case and a number.</small>
      <label>Confirm new password <input name="confirm" type="password" required autocomplete="new-password" /></label>
      <button type="submit" [disabled]="form.busy()">Reset password</button>
    </form>
  }
  <p><a routerLink="/sign-in">Back to sign in</a></p>
</main>
