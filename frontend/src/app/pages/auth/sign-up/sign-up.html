<main class="card">
  <h1>Aussie EcoGuard</h1>
  @if (form.message(); as message) {
    <p class="message" [class]="message.type" role="status">{{ message.text }}</p>
  }

  @if (!email()) {
    <h2>Create an account</h2>
    <form (submit)="form.submit($event, signUp)">
      <label>First name <input name="firstName" required autocomplete="given-name" /></label>
      <label>Last name <input name="lastName" required autocomplete="family-name" /></label>
      <label>Email <input name="email" type="email" required autocomplete="email" /></label>
      <label>Password <input name="password" type="password" required minlength="8" autocomplete="new-password" /></label>
      <small>At least 8 characters with upper case, lower case and a number.</small>
      <label>Confirm password <input name="confirm" type="password" required autocomplete="new-password" /></label>
      <button type="submit" [disabled]="form.busy()">Sign up</button>
    </form>
    <p>Already have an account? <a routerLink="/sign-in">Sign in</a></p>
  } @else {
    <h2>Verify your email</h2>
    <p>We emailed a verification code to <strong>{{ email() }}</strong>.</p>
    <form (submit)="form.submit($event, verify)">
      <label>Verification code <input name="code" required inputmode="numeric" autocomplete="one-time-code" /></label>
      <button type="submit" [disabled]="form.busy()">Verify</button>
    </form>
    <p><button type="button" class="link" (click)="resend()">Resend code</button></p>
  }
</main>
