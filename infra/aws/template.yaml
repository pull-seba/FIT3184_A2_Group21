AWSTemplateFormatVersion: "2010-09-09"
Description: "Aussie EcoGuard - Cognito user pool and web app client (rubric 1.1). Owner: member 1."

# Deploy (needs a person to approve):
#   aws cloudformation deploy --template-file infra/aws/template.yaml --stack-name ecoguard-auth --region us-east-1
# Then copy the UserPoolId and UserPoolClientId outputs into frontend/src/environments/environment.ts.
# Storage, database and tagging live on GCP (docs/architecture.md), so this stack holds only Cognito.

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ecoguard-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # The spec asks for email, first name and last name at sign-up.
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: given_name
          Required: true
          Mutable: true
        - Name: family_name
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      # Self sign-up: Cognito emails a code to verify the address.
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Verify your Aussie EcoGuard account
        EmailMessage: "Welcome to Aussie EcoGuard! Your verification code is {####}"
      # Admin-invited users get a temporary password they must change at first sign-in. Both paths stay
      # open because the spec asks for the temporary password change (open question in docs/decisions.md).
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
        InviteMessageTemplate:
          EmailSubject: Your Aussie EcoGuard account
          EmailMessage: "You have been invited to Aussie EcoGuard. Username: {username} Temporary password: {####} - you will be asked to choose a new password when you first sign in."

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: ecoguard-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false # browser app: a secret could not be kept private
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH # SRP: the password itself is never sent to Cognito
        - ALLOW_REFRESH_TOKEN_AUTH
      EnableTokenRevocation: true # sign-out revokes tokens server-side
      PreventUserExistenceErrors: ENABLED
      ReadAttributes: [email, email_verified, given_name, family_name]
      WriteAttributes: [email, given_name, family_name]

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Also the audience API Gateway checks on the ID token
    Value: !Ref UserPoolClient
  Issuer:
    Description: Issuer for the API Gateway securityDefinitions
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
